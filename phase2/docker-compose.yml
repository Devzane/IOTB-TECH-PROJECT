services:
  db:
    image: postgres:16-alpine
    container_name: zeetafin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zeetafin_secret
      POSTGRES_DB: zeetafin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zeetafin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zeetafin-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zeetafin-backend:local
    container_name: zeetafin-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: zeetafin_secret
      DB_NAME: zeetafin
      JWT_SECRET: super_secret_jwt_key_zeetafin_devops_assignment_2026
      NODE_ENV: production
      DB_SYNC: "true"
      DB_LOGGING: "false"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zeetafin-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    image: zeetafin-frontend:local
    container_name: zeetafin-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - zeetafin-network

volumes:
  postgres_data:
    driver: local

networks:
  zeetafin-network:
    driver: bridge
